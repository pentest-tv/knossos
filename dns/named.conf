options {
    // This image runs named as a non-root user; /var/cache/bind is not writable,
    // so use /tmp for the working directory.
    directory "/tmp";
    recursion no;
    allow-query { any; };
    dnssec-validation no;
    listen-on { any; };
    listen-on-v6 { none; };
};

// pentesttv.local is served authoritatively. allow-transfer is deliberately open to
// anyone, so a zone transfer (dig axfr pentesttv.local @172.28.10.34) dumps the zone,
// including the flag TXT record. That open AXFR is the finding this module teaches.
zone "pentesttv.local" {
    type master;
    file "/zones/db.pentesttv.local";
    allow-transfer { any; };
};
