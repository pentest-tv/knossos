# Minimal, deterministic slapd config for the lab directory. Anonymous read is allowed on
# everything (the intentional misconfiguration), so ldapsearch -x dumps the tree including
# the service account's leaked password and the module flag.
include         /etc/ldap/schema/core.schema
include         /etc/ldap/schema/cosine.schema
include         /etc/ldap/schema/inetorgperson.schema
include         /etc/ldap/schema/nis.schema

pidfile         /var/run/slapd/slapd.pid
argsfile        /var/run/slapd/slapd.args

modulepath      /usr/lib/ldap
moduleload      back_mdb

database        mdb
maxsize         1073741824
suffix          "dc=pentesttv,dc=local"
rootdn          "cn=admin,dc=pentesttv,dc=local"
rootpw          admin
directory       /var/lib/ldap
index           objectClass eq

# Deliberately permissive: anonymous can read the whole directory.
access to *
    by self read
    by dn.exact="cn=admin,dc=pentesttv,dc=local" write
    by * read
