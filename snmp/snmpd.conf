# Deliberately weak SNMP config for the lab. Exposes the classic default community
# strings the student enumerates and then abuses for write access.
agentAddress udp:161

# Read-only community
rocommunity public default

# Read-write community (the finding the student is meant to discover)
rwcommunity private default

sysLocation Pentest.TV DMZ
# sysContact leaks a valid internal username (jsmith), which feeds the SSH
# password-attack module. Classic SNMP information disclosure.
sysContact jsmith@pentesttv.local
sysName net-01.pentesttv.local
