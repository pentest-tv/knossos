[global]
   workgroup = PENTESTTV
   server string = Pentest.TV Workstation
   security = user
   map to guest = Bad User
   guest account = nobody
   server min protocol = SMB2
   log level = 0

# World-writable drop share. A student uploads a payload here; the runner loop on the
# host executes it as the victim user, simulating a user running an attachment.
[drop]
   comment = Shared drop folder
   path = /srv/drop
   browseable = yes
   read only = no
   guest ok = yes
   force user = root
   create mask = 0777
